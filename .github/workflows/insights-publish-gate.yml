name: Insights publish gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  owner-approval:
    name: Insights owner approval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Require the owner-approved label when an Insights article changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node scripts/check-insights-owner-approval.mjs

  content-quality:
    name: Insights content quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check the quality rules
        run: node --test scripts/insights-quality.test.mjs
      - name: Reject filler in added or changed Insights articles
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-insights-content-quality.mjs
