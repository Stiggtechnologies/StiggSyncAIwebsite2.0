name: Next 15 Upgrade Validation

on:
  push:
    branches:
      - chore/next15-security-upgrade
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Upgrade React 19 peer dependencies
        run: >-
          npm install --save
          cmdk@latest
          embla-carousel-react@latest
          input-otp@latest
          next-themes@latest
          react-day-picker@latest
          react-resizable-panels@latest
          recharts@latest
          sonner@latest
          vaul@latest

      - name: Install dependencies from refreshed lockfile
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit compatible dependency set and lockfile
        if: success() && github.event_name == 'push'
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency files are already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json package-lock.json
          git commit -m "chore: refresh dependencies for React 19"
          git push
